<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="description" content="Offline personal budgeting app">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="dashboard-layout.css?v=2">
  <link rel="stylesheet" href="futuristic-theme.css?v=2">
  <link rel="stylesheet" href="analytics-table.css?v=3">
  <link rel="stylesheet" href="analytics-table-lock.css?v=2">
  <link rel="stylesheet" href="logo.css?v=8">
  <link rel="stylesheet" href="footer.css?v=2">
  <link rel="stylesheet" href="savings-bar.css?v=1">
  <style>.topbar{display:flex;align-items:center}.topbar-heading{margin-left:auto;text-align:right}.topbar-heading .eyebrow{display:none}.topbar-heading h1{margin:0}.app-loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0b1f3a;color:#fff;transition:opacity .35s ease,visibility .35s ease}.app-loading.hide{opacity:0;visibility:hidden;pointer-events:none}.app-loading-inner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}.app-loading-brand{font-size:30px;font-weight:800;letter-spacing:.4px}.app-loading-brand b{font-weight:500}.app-loading-subtitle{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;opacity:.7}.app-loading-spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:budget-spin .8s linear infinite}@keyframes budget-spin{to{transform:rotate(360deg)}}
  </style>
  <title>NATRA Budget</title>
</head>
<body>
  <div class="app-loading" id="appLoading" aria-label="Initializing NATRA Budget"><div class="app-loading-inner"><div class="app-loading-brand">NATRA <b>Budget</b></div><div class="app-loading-subtitle">Initializing</div><div class="app-loading-spinner" aria-hidden="true"></div></div></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigation drawer">
      <div class="brand"><span class="brand-logo" aria-label="NATRA Budget">NATRA <b>Budget</b></span><button class="drawer-close" id="drawerClose" type="button" aria-label="Close menu">×</button></div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        <button class="nav-item" data-page="income"><span class="nav-icon">↗</span><span>Income</span></button>
        <button class="nav-item" data-page="expenses"><span class="nav-icon">↘</span><span>Expenses</span></button>
        <button class="nav-item" data-page="budget"><span class="nav-icon">◫</span><span>Budget</span></button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </nav>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <main class="main-content">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="Open menu" aria-expanded="false">☰</button>
        <span class="header-logo" aria-label="NATRA Budget">NATRA <b>Budget</b></span>
        <div class="topbar-heading"><h1 id="pageTitle">Dashboard</h1></div>
      </header>
      <section id="pageContent" class="page-content"></section>
      <footer class="site-footer">powered by NATRA Technology ©2026</footer>
    </main>
  </div>
  <script src="app.js?v=2"></script>
  <script src="budget.js?v=2"></script>
  <script src="dashboard.js?v=2"></script>
  <script src="settings.js?v=2"></script>
  <script src="i18n.js?v=2"></script>
  <script src="back-navigation.js?v=1"></script>
  <script src="dashboard-financial-separation.js?v=1"></script>
  <script src="spending-alerts.js?v=1"></script>
  <script>
    const drawer = document.getElementById('sidebar');
    const backdrop = document.getElementById('drawerBackdrop');
    const menu = document.getElementById('menuButton');
    const closeDrawer = document.getElementById('drawerClose');
    const syncDrawer = () => { const open = drawer.classList.contains('open'); backdrop.classList.toggle('open', open); menu.setAttribute('aria-expanded', String(open)); };
    menu.addEventListener('click', () => requestAnimationFrame(syncDrawer));
    closeDrawer.addEventListener('click', () => { drawer.classList.remove('open'); syncDrawer(); });
    backdrop.addEventListener('click', () => { drawer.classList.remove('open'); syncDrawer(); });
    new MutationObserver(syncDrawer).observe(drawer, { attributes:true, attributeFilter:['class'] });
    const hideLoading = () => { const loading = document.getElementById('appLoading'); if (loading) { loading.classList.add('hide'); setTimeout(() => loading.remove(), 400); } };
    const loadingWatcher = new MutationObserver(() => { if (document.getElementById('pageContent')?.innerHTML.trim()) { loadingWatcher.disconnect(); hideLoading(); } });
    loadingWatcher.observe(document.getElementById('pageContent'), { childList:true });
    setTimeout(hideLoading, 6000);
  </script>
</body>
</html>
